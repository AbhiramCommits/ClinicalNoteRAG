name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: lint and test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest with coverage
        run: |
          mkdir -p artifacts
          pytest -q --cov=clinicalnoterag --cov-report=term --cov-report=json:artifacts/coverage.json
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage.json

  smoke:
    name: offline smoke pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Smoke path (20 patients, hashing embeddings, offline)
        run: make smoke
