[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicalnoterag"
version = "0.1.0"
description = "Retrieval-augmented, citation-grounded QA over synthetic FHIR bundles and clinical notes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "ClinicalNoteRAG contributors" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "torch>=2.2",
  "transformers>=4.40",
  "peft>=0.10",
  "trl>=0.9",
  "datasets>=2.19",
  "accelerate>=0.30",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=2.7"]
deid = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "scikit-learn>=1.4"]
airflow = ["apache-airflow>=2.9"]

[project.scripts]
clinicalnoterag = "clinicalnoterag.cli:app"

[tool.setuptools.packages.find]
include = ["clinicalnoterag*"]
exclude = ["tests*", "dags*", "scripts*", "data*", "artifacts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "artifacts", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501", "B008", "SIM108", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
"dags/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "docker: requires a running Docker daemon",
  "slow: long-running test",
  "network: requires network access",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
source = ["clinicalnoterag"]
branch = true
omit = ["clinicalnoterag/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
