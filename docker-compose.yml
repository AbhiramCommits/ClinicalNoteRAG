services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clinicalnoterag-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicalnoterag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clinicalnoterag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinicalnoterag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["pipeline"]
    command:
      - clinicalnoterag
      - ingest
      - --corpus
      - /data/corpus
      - --store
      - pgvector
      - --out
      - /app/artifacts/ingest_report.json
    environment:
      VECTOR_BACKEND: pgvector
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clinicalnoterag}
      ARTIFACT_DIR: /app/artifacts
      LLM_BACKEND: extractive
    volumes:
      - ./data:/data:ro
      - clinicalnoterag_artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicalnoterag-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      VECTOR_BACKEND: pgvector
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-clinicalnoterag}
      ARTIFACT_DIR: /app/artifacts
      LLM_BACKEND: extractive
      SEED: "42"
    volumes:
      - clinicalnoterag_artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  clinicalnoterag_pgdata:
  clinicalnoterag_artifacts:
